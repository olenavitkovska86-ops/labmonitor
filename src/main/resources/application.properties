spring.application.name=labmonitor

# MySQL connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/labmonitor_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway applies database changes automatically on application startup.
# Existing databases created from the former manual V1 schema are baselined at
# version 1 and receive only newer migrations.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true


spring.docker.compose.enabled=false
# Server
server.port=8080

# Replace with a random value of at least 32 characters, never commit this to git in production
jwt.secret=byt-ut-mig-mot-nagot-slumpmassigt-och-langt-nog
jwt.expiration=3600000

logging.level.com.olena.labmonitor=DEBUG
logging.level.org.springframework.security=DEBUG

# Monitoring policy. Environment variables can override these values without a code change.
labmonitor.monitoring.alerts.low-max-percent=${ALERT_LOW_MAX_PERCENT:5}
labmonitor.monitoring.alerts.medium-max-percent=${ALERT_MEDIUM_MAX_PERCENT:15}
labmonitor.monitoring.alerts.high-max-percent=${ALERT_HIGH_MAX_PERCENT:30}
labmonitor.monitoring.alerts.auto-recovery-max-duration=${ALERT_AUTO_RECOVERY_MAX_DURATION:5m}
labmonitor.monitoring.alerts.auto-recovery-severities=${ALERT_AUTO_RECOVERY_SEVERITIES:LOW,MEDIUM}
labmonitor.monitoring.readings.history-default-period=${READING_HISTORY_DEFAULT_PERIOD:24h}
labmonitor.monitoring.readings.history-max-results=${READING_HISTORY_MAX_RESULTS:1000}
labmonitor.monitoring.readings.history-periods=${READING_HISTORY_PERIODS:1h,24h,7d,30d}
labmonitor.monitoring.sensors.offline-after=${SENSOR_OFFLINE_AFTER:2m}
labmonitor.monitoring.sensors.offline-check-interval=${SENSOR_OFFLINE_CHECK_INTERVAL:10s}
labmonitor.monitoring.exports.max-period=${READING_EXPORT_MAX_PERIOD:30d}
labmonitor.monitoring.exports.max-rows=${READING_EXPORT_MAX_ROWS:250000}

# Demo sensor simulator. It is always off after application startup.
labmonitor.simulator.max-sensors=${SENSOR_SIMULATOR_MAX_SENSORS:20}
