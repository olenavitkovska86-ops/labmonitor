# Production must fail fast when database credentials are missing.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# HTTPS is expected at the application or reverse proxy boundary.
jwt.cookie-secure=true
server.forward-headers-strategy=framework

# Never bootstrap an unknown production schema implicitly.
spring.flyway.baseline-on-migrate=false
spring.jpa.show-sql=false

logging.level.com.olena.labmonitor=INFO
logging.level.org.springframework.security=INFO
