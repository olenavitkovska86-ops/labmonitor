<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | LabMonitor</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topbar">
    <a class="brand" href="/">LabMonitor</a>
    <span class="subtitle">Account settings</span>
</header>
<main class="page profile-page">
    <nav class="breadcrumbs" aria-label="Breadcrumb">
        <a class="breadcrumb-link" href="/">Home</a>
        <span class="breadcrumb-separator" aria-hidden="true">›</span>
        <span class="breadcrumb-current" aria-current="page">Profile</span>
    </nav>
    <section class="hero">
        <div>
            <p class="eyebrow">Your account</p>
            <h1>Profile</h1>
            <p class="intro">Personal details and access assigned by administrators.</p>
        </div>
    </section>
    <div id="profile-message" class="message hidden" role="alert"></div>
    <div class="profile-grid">
        <section class="panel">
            <div class="panel-heading"><h2>Personal details</h2></div>
            <form id="profile-form">
                <label for="profile-email">Email</label>
                <input id="profile-email" type="email" disabled>
                <label for="profile-first-name">First name</label>
                <input id="profile-first-name" required>
                <label for="profile-last-name">Last name</label>
                <input id="profile-last-name" required>
                <label for="profile-phone">Phone</label>
                <input id="profile-phone" maxlength="50">
                <div class="form-actions"><button class="button button-primary" type="submit">Save profile</button></div>
            </form>
        </section>
        <section class="panel">
            <div class="panel-heading"><h2>Change password</h2></div>
            <form id="password-form">
                <label for="old-password">Current password</label>
                <input id="old-password" type="password" autocomplete="current-password" required>
                <label for="new-password">New password</label>
                <input id="new-password" type="password" autocomplete="new-password" minlength="8" required>
                <div class="form-actions"><button class="button button-primary" type="submit">Change password</button></div>
            </form>
        </section>
    </div>
    <section class="panel">
        <div class="panel-heading"><h2>Access</h2></div>
        <p id="global-access" class="state"></p>
        <div id="membership-list" class="membership-list"></div>
    </section>
</main>
<script src="/js/api-client.js"></script>
<script src="/js/auth-context.js"></script>
<script src="/js/profile.js"></script>
</body>
</html>
