<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensors | LabMonitor</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topbar">
    <a class="brand" href="/">LabMonitor</a>
    <span class="subtitle">Laboratory management</span>
</header>

<main class="page">
    <nav id="breadcrumbs" class="breadcrumbs" aria-label="Breadcrumb"></nav>

    <section class="hero">
        <div>
            <p class="eyebrow">Monitoring</p>
            <h1>Sensors</h1>
            <p class="intro">Manage room sensors and their safe value ranges.</p>
        </div>
        <button id="show-create-form" class="button button-primary hidden" type="button" data-permission="sensors.manage" data-permission-reveal>
            Add sensor
        </button>
    </section>

    <section id="sensor-form-panel" class="panel form-panel hidden">
        <div class="panel-heading">
            <h2 id="form-title">New sensor</h2>
            <button id="close-form" class="icon-button" type="button" aria-label="Close">&times;</button>
        </div>

        <form id="sensor-form">
            <input id="sensor-id" type="hidden">

            <label for="sensor-room">Room</label>
            <select id="sensor-room" required>
                <option value="">Select a room</option>
            </select>

            <label for="sensor-name">Name</label>
            <input id="sensor-name" maxlength="150" required>

            <label for="sensor-type">Type</label>
            <select id="sensor-type" required>
                <option value="">Select a sensor type</option>
                <option value="TEMPERATURE">Temperature</option>
                <option value="HUMIDITY">Humidity</option>
                <option value="CO2">CO₂</option>
                <option value="SMOKE">Smoke</option>
                <option value="MOTION">Motion</option>
                <option value="DOOR">Door</option>
                <option value="PRESSURE">Pressure</option>
                <option value="LIGHT">Light</option>
                <option value="NOISE">Noise</option>
                <option value="ENERGY">Energy</option>
                <option value="OCCUPANCY">Occupancy</option>
                <option value="OTHER">Other</option>
            </select>

            <label for="sensor-unit">Unit</label>
            <input id="sensor-unit" maxlength="30" placeholder="For example: °C, %, ppm">

            <div id="form-error" class="message message-error hidden" role="alert"></div>

            <div class="form-actions">
                <button class="button button-primary" type="submit">Save</button>
                <button id="cancel-form" class="button button-secondary" type="button">Cancel</button>
            </div>
        </form>
    </section>

    <section id="safe-range-panel" class="panel form-panel hidden">
        <div class="panel-heading">
            <h2 id="safe-range-title">Safe range</h2>
            <button id="close-safe-range" class="icon-button" type="button" aria-label="Close">&times;</button>
        </div>

        <form id="safe-range-form">
            <input id="safe-range-sensor-id" type="hidden">

            <label for="min-safe-value">Minimum safe value</label>
            <input id="min-safe-value" type="number" step="0.001">

            <label for="max-safe-value">Maximum safe value</label>
            <input id="max-safe-value" type="number" step="0.001">

            <div id="safe-range-error" class="message message-error hidden" role="alert"></div>

            <div class="form-actions">
                <button class="button button-primary" type="submit">Save range</button>
                <button id="cancel-safe-range" class="button button-secondary" type="button">Cancel</button>
            </div>
        </form>
    </section>

    <section class="panel">
        <form id="search-form" class="toolbar">
            <label class="search">
                <span>Search</span>
                <input id="search-input" type="search" placeholder="Sensor name">
            </label>

            <label class="search">
                <span>Room</span>
                <select id="room-filter">
                    <option value="">All rooms</option>
                </select>
            </label>

            <button class="button button-secondary" type="submit">Search</button>
            <button id="clear-search" class="button button-link" type="button">Clear</button>

            <label class="search">
                <span>Export period</span>
                <select id="room-export-period">
                    <option value="24">24 hours</option>
                    <option value="168">7 days</option>
                    <option value="720">30 days</option>
                </select>
            </label>

            <button id="export-room-readings" class="button button-secondary" type="button" disabled
                    title="Select a room to export its readings">
                Export room CSV
            </button>
        </form>

        <div id="page-message" class="message hidden" role="status"></div>
        <p id="loading-state" class="state">Loading sensors...</p>
        <p id="empty-state" class="state hidden">No sensors found.</p>

        <div id="table-wrapper" class="table-wrapper hidden">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Room</th>
                    <th>Type</th>
                    <th>Unit</th>
                    <th>Device status</th>
                    <th>Current reading</th>
                    <th>Safe range</th>
                    <th>Active</th>
                    <th class="actions-column">Actions</th>
                </tr>
                </thead>
                <tbody id="sensor-rows"></tbody>
            </table>
        </div>
    </section>
</main>

<script src="/js/breadcrumbs.js"></script>
<script src="/js/api-client.js"></script>
<script src="/js/auth-context.js"></script>
<script src="/js/app-shell.js"></script>
<script src="/js/sensors.js"></script>
<script src="/js/alert-notifications.js"></script>
</body>
</html>
