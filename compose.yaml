services:
  mysql:
    image: mysql:8.4
    container_name: labmonitor-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: labmonitor_db
      MYSQL_USER: labmonitor_user
      MYSQL_PASSWORD: labmonitor_password
      MYSQL_ROOT_PASSWORD: root_password

    ports:
      - "3306:3306"

    volumes:
      - labmonitor_mysql_data:/var/lib/mysql

volumes:
  labmonitor_mysql_data:
